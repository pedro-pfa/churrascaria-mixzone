<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio | Frango da Via 4</title>
  <meta name="description" content="Veja o nosso cardápio completo: frango grelhado, pratos do dia, pequenos almoços, sobremesas e bebidas.">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo" id="topo"></header>

  <main>
    <section class="alt" style="padding-bottom: 2rem;">
      <div class="container">
        <h1>O nosso Cardápio</h1>
        <p class="muted" style="margin-top: .5rem;">Escolha uma categoria ou procure pelo nome do prato.</p>
        
        <!-- Barra de Busca e Filtros -->
        <div style="margin-top: 1.5rem;">
          <label class="muted" for="busca" style="display: block; margin-bottom: .5rem;">Procurar no cardápio:</label>
          <input id="busca" class="busca" type="search" placeholder="Ex.: frango, café, pudim..." autocomplete="off">
          <div id="chips" class="chips" role="group" aria-label="Filtrar por categoria"></div>
        </div>
      </div>
    </section>

    <!-- Lista de Produtos -->
    <section>
      <div class="container" style="padding-bottom: 3rem;">
        <div id="produtos" class="grade"></div>
      </div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <!-- Scripts -->
  <script src="js/produtos.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
